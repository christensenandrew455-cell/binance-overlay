name: Build downloadable indicator preview APK

on:
  push:
    branches: [feature/indicator-timeframe-holdout]
  pull_request:
    paths:
      - 'app/src/main/java/com/decisionoverlay/checker/BtcEdgeTest.kt'
      - 'app/src/main/java/com/decisionoverlay/checker/BtcFiveIndicatorEnsemble.kt'
      - 'app/src/test/java/com/decisionoverlay/checker/BtcEdgeTestTest.kt'
      - 'app/src/test/java/com/decisionoverlay/checker/BtcFiveIndicatorEnsembleTest.kt'
      - '.github/workflows/test-indicators.yml'

permissions:
  contents: write

jobs:
  indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Compile and run Android unit tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Name the preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk five-indicator-preview.apk
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: five-indicator-preview-apk
          path: five-indicator-preview.apk
          if-no-files-found: error
      - name: Publish Android APK as a preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "five-indicator-preview-${GITHUB_RUN_ID}" \
            five-indicator-preview.apk \
            --title "Five-indicator combined-test APK (${GITHUB_RUN_ID})" \
            --notes "Android debug preview with five-indicator joint-vote test across the existing 1,000 BTC markets at commit ${GITHUB_SHA}. Not merged into main. No live trade execution. Built and tested by GitHub Actions." \
            --target "${GITHUB_SHA}" \
            --prerelease
