name: Verify indicator research (branch only)

on:
  push:
    branches: [feature/indicator-timeframe-holdout]
  pull_request:
    paths:
      - 'app/src/main/java/com/decisionoverlay/checker/BtcEdgeTest.kt'
      - 'app/src/test/java/com/decisionoverlay/checker/BtcEdgeTestTest.kt'
      - '.github/workflows/test-indicators.yml'

permissions:
  contents: read

jobs:
  indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Compile and run Android unit tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug --stacktrace
