name: Kalshi API and live risk guard tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/kalshi-demo-client-tests.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r tools/requirements-kalshi.txt
      - name: Compile
        run: python -m py_compile tools/kalshi_api.py tools/kalshi_live_rules.py tools/kalshi_live_runner.py
      - name: Offline unit tests (no orders)
        run: python -m unittest discover -s tools -p 'test_kalshi*.py' -v
